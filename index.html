<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BECOMING.</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#463b2d;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:480px;margin:auto;padding:25px 18px 110px}h1{font:32px Georgia;letter-spacing:3px;color:#967640;margin:0}h2{font:22px Georgia;color:#967640}small{color:#887b67}section{background:#fffdf8;border:1px solid #e8dfce;border-radius:18px;padding:18px;margin:14px 0}button,input,select,textarea{font:inherit;border:1px solid #d8c8aa;border-radius:10px;padding:12px;background:#fffdf8;color:inherit;max-width:100%}button{cursor:pointer}button.gold{background:#a88b55;color:white;border:0;width:100%}input,textarea,select{width:100%;margin:5px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8;display:flex;justify-content:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e8dfce}nav button{border:0;background:none;font-size:11px;flex:1;max-width:96px}nav b{display:block;font-size:20px;margin-bottom:5px}.stats{display:flex;justify-content:space-between;text-align:center}.stats strong{display:block;font:25px Georgia;color:#967640}progress{width:100%;accent-color:#a88b55}label{display:block;margin-top:10px}p{line-height:1.7}img{max-width:100%;border-radius:12px}</style><main><h1>BECOMING.</h1><small>A LITTLE BETTER, EVERY DAY.</small><div id="page"></div></main><nav id="nav"></nav><script>
const key='becoming-v1';let s;try{s=JSON.parse(localStorage.getItem(key))}catch{}s=s||{xp:0,coins:0,days:[],logs:[],body:[],rewards:[],rest:[]};let tab=0;const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('sv-SE'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){alert('保存できませんでした。端末の容量をご確認ください。')}render()}function award(x,c){s.xp+=x;s.coins+=c}function streak(){let d=new Date(),n=0;if(!s.days.includes(today()))d.setDate(d.getDate()-1);while(s.days.includes(d.toLocaleDateString('sv-SE'))){n++;d.setDate(d.getDate()-1)}return n}function week(){let d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return new Set(s.logs.filter(x=>x.date>=d.toLocaleDateString('sv-SE')&&x.date<=today()&&x.kind==='ジム').map(x=>x.date)).size}function claim(){if(s.days.includes(today()))return;s.days.push(today());award(10,5);let n=streak();if(n%7===0)award(100,50);if(n%30===0)award(500,250);save()}function rest(){if(s.rest.includes(today()))return;s.rest.push(today());award(10,5);save()}function render(){let p=$('page');$('nav').innerHTML=['⌂|HOME','↗|GROWTH','＋|LOG','☆|QUEST','◎|ME'].map((x,i)=>`<button onclick="tab=${i};render()" style="color:${tab===i?'#967640':'#887b67'}"><b>${x.split('|')[0]}</b>${x.split('|')[1]}</button>`).join('');if(tab===0)p.innerHTML=`<section><small>YOUR EVOLUTION</small><h2>Level ${String(1+Math.floor(s.xp/500)).padStart(2,'0')}</h2><progress max="500" value="${s.xp%500}"></progress><small>${s.xp%500} / 500 XP</small></section><section class="stats"><div><strong>${streak()}</strong>STREAK</div><div><strong>${week()}/2</strong>WORKOUT</div><div><strong>${s.coins}</strong>COINS</div></section><button class="gold" onclick="claim()" ${s.days.includes(today())?'disabled':''}>${s.days.includes(today())?'✓ BONUS CLAIMED':'DAILY BONUS +10 XP'}</button><section><small>YOUR COACH</small><p>あら、今日も自分を育てる時間よ。完璧より継続。休養だって立派な戦略よ。</p></section><button class="gold" onclick="tab=2;render()">＋ トレーニングを記録</button>`;if(tab===1)p.innerHTML=`<h2>GROWTH</h2>${s.logs.slice().reverse().map(x=>`<section><small>${esc(x.date)} · ${esc(x.kind)}</small><h3>${esc(x.name)}</h3><p>${x.kg} kg × ${x.reps} 回 × ${x.sets} セット</p><p>${esc(x.analysis)}</p></section>`).join('')||'<section>まだ記録がありません。</section>'}<h2>BODY</h2>${s.body.slice().reverse().map(x=>`<section>${esc(x.date)}　${x.weight} kg　${x.fat}%</section>`).join('')}`;if(tab===2)p.innerHTML=`<h2>LOG</h2><section><small>MANUAL WORKOUT</small><label>日付<input id="date" type="date" value="${today()}"></label><label>種類<select id="kind"><option>ジム</option><option>自宅</option><option>有酸素</option></select></label><label>種目<input id="name" placeholder="ヒップスラスト"></label><label>重量 kg<input id="kg" type="number" min="0" step="0.25" value="0"></label><label>回数（有酸素は分）<input id="reps" type="number" min="1" value="12"></label><label>セット<input id="sets" type="number" min="1" value="3"></label><label>体調・メモ<textarea id="note"></textarea></label><button class="gold" onclick="log()">保存して成長分析</button></section><section><small>IMPORT WORKOUT</small><input type="file" accept="image/*" multiple onchange="preview(this)"><div id="preview"></div><small>試作版では画像の確認のみ。自動読み取りは未接続です。</small></section><section><button onclick="rest()">休養日を記録 +10 XP</button></section>`;if(tab===3)p.innerHTML=`<h2>QUEST</h2><section>週間ジム目標 ${week()} / 2<progress max="2" value="${week()}"></progress><p>休養日記録：${s.rest.length}日</p></section><h2>REWARDS</h2><section><input id="reward" placeholder="ご褒美の名前"><input id="cost" type="number" min="1" placeholder="必要コイン"><button onclick="addReward()">追加</button></section>${s.rewards.map((r,i)=>`<section>${esc(r.name)} · ${r.cost} coins <button ${r.done||s.coins<r.cost?'disabled':''} onclick="redeem(${i})">${r.done?'交換済':'交換'}</button></section>`).join('')}`;if(tab===4)p.innerHTML=`<h2>ME</h2><section><small>BODY RECORD</small><input id="weight" type="number" step="0.1" placeholder="体重 kg"><input id="fat" type="number" step="0.1" placeholder="体脂肪率 %"><button class="gold" onclick="body()">記録</button></section><section><small>DATA</small><p>この試作版は端末内保存です。クラウド・通知・AI・体型写真保存は未接続。</p><button onclick="exportData()">データを書き出す</button></section>`}function log(){let name=$('name').value.trim(),kg=+$('kg').value,reps=+$('reps').value,sets=+$('sets').value,date=$('date').value,kind=$('kind').value;if(!name||!date||date>today()||kg<0||reps<1||sets<1)return alert('入力を確認してね');let prev=s.logs.filter(x=>x.name===name&&x.kind===kind&&x.date<=date).sort((a,b)=>b.date.localeCompare(a.date))[0],v=kg*reps*sets,analysis=prev?`前回比：重量 ${kg-prev.kg>=0?'+':''}${kg-prev.kg} kg、総負荷 ${v-prev.kg*prev.reps*prev.sets>=0?'+':''}${v-prev.kg*prev.reps*prev.sets} kg。数字だけでなくフォームも大切よ。`:'最初の記録よ。ここから育てましょ！';if(kind==='有酸素')analysis='有酸素の記録完了。無理なく続けましょ。';if(!s.logs.some(x=>x.date===date))award(kind==='ジム'?100:30,kind==='ジム'?50:15);s.logs.push({name,kg,reps,sets,date,kind,note:$('note').value,analysis});tab=1;save()}function preview(el){$('preview').innerHTML='';for(let f of el.files){let img=document.createElement('img');img.src=URL.createObjectURL(f);$('preview').append(img)}}function body(){let weight=+$('weight').value,fat=+$('fat').value;if(weight<=0||fat<=0||fat>=100)return alert('入力を確認してね');s.body.push({date:today(),weight,fat});save()}function addReward(){let name=$('reward').value.trim(),cost=+$('cost').value;if(name&&cost>0){s.rewards.push({name,cost});save()}}function redeem(i){let r=s.rewards[i];if(!r.done&&s.coins>=r.cost){s.coins-=r.cost;r.done=true;save()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='becoming-backup.json';a.click()}render();</script></html>
